
<!DOCTYPE html>
<html>
<head>
    <title>HTML 소개</title>

    <style>
        body {
            background-color: lightyellow;
            text-align: center;
        }

        h1 {
            color: blue;
        }

        table {
            margin: auto;
            border-collapse: collapse;
        }

        td, th {
            border: 1px solid black;
            padding: 10px;
        }
    </style>
</head>

<body>

    <h1>HTML이란?</h1>

    <p>HTML은 웹페이지를 만드는 언어입니다.</p>
    <p>인터넷에서 볼 수 있는 홈페이지를 만들 때 사용합니다.</p>

    <h2>HTML의 특징</h2>

    <table>
        <tr>
            <th>종류</th>
            <th>설명</th>
        </tr>
        <tr>
            <td>HTML</td>
            <td>웹페이지의 구조</td>
        </tr>
        <tr>
            <td>CSS</td>
            <td>웹페이지의 디자인</td>
        </tr>
    </table>

    <h2>HTML 기본 태그</h2>

    <p>h1 : 제목을 작성합니다.</p>
    <p>p : 문장을 작성합니다.</p>
    <p>br : 줄을 바꿉니다.</p>
    <p>table : 표를 만듭니다.</p>

    <h2>마무리</h2>

    <p>HTML을 이용하면 간단한 웹페이지를 만들 수 있습니다.</p>

</body>
</html>
